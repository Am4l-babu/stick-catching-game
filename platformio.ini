; PlatformIO Project Configuration File
; Docs: https://docs.platformio.org/page/projectconf.html
;
; The sketch lives in stick_catching_game/stick_catching_game.ino so the same
; file opens directly in the Arduino IDE *and* builds in PlatformIO.

[platformio]
src_dir = stick_catching_game
default_envs = nodemcuv2

[env]
platform = espressif8266
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, default
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2

; ---- NodeMCU 1.0 (ESP-12E) — the default target ----
[env:nodemcuv2]
board = nodemcuv2
upload_speed = 921600
; Uncomment and set if PlatformIO picks the wrong port:
; upload_port = COM3
; monitor_port = COM3

; ---- Wemos D1 mini — use if that is your board ----
[env:d1_mini]
board = d1_mini
upload_speed = 921600

; ---- Servo test sketch (wiring / calibration check, NOT the game) ----
; Build & flash:  pio run -e servo_test -t upload
; Then open the serial monitor (115200) and type ? for commands.
[env:servo_test]
board = nodemcuv2
upload_speed = 921600
build_src_filter = -<*> +<../pio/servo_test_entry.cpp>
; the sketch is pulled in from outside src_dir, so scan dependencies deeply
lib_ldf_mode = deep+
